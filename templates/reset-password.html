{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password · Meridian PM</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    <div class="auth">
      <section class="auth-brand">
        <div class="auth-logo">
          <div class="brand-mark">MP</div>
          <strong>Meridian PM</strong>
        </div>
        <h1>Create a new password.</h1>
        <p>Choose a strong password for your Meridian PM account.</p>
      </section>
      <section class="auth-form">
        <div class="auth-box">
          <div class="auth-logo">
            <div class="brand-mark">MP</div>
            <strong>Meridian PM</strong>
          </div>
          <h2>Reset password</h2>
          <p>Your new password should be at least 8 characters.</p>
          <form data-demo-form data-success="Password updated successfully">
            <div class="form-group" style="margin-bottom: 14px">
              <label>New password</label
              ><input
                type="password"
                minlength="8"
                required
                placeholder="New password"
              />
            </div>
            <div class="form-group" style="margin-bottom: 18px">
              <label>Confirm password</label
              ><input
                type="password"
                minlength="8"
                required
                placeholder="Confirm password"
              />
            </div>
            <button class="btn primary" style="width: 100%">
              Update password
            </button>
          </form>
          <p style="margin-top: 18px">
            <a class="auth-link" href="login.html">← Back to sign in</a>
          </p>
        </div>
      </section>
    </div>
    <div class="toast-wrap"></div>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
