{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot password · Meridian PM</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    <div class="auth">
      <section class="auth-brand">
        <div class="auth-logo">
          <div class="brand-mark">MP</div>
          <strong>Meridian PM</strong>
        </div>
        <h1>Reset access securely.</h1>
        <p>
          Enter the work email associated with your Meridian PM account and
          we'll prepare a reset link.
        </p>
      </section>
      <section class="auth-form">
        <div class="auth-box">
          <div class="auth-logo">
            <div class="brand-mark">MP</div>
            <strong>Meridian PM</strong>
          </div>
          <h2>Forgot password?</h2>
          <p>No problem. We'll send a reset link to your email.</p>
          <form data-demo-form data-success="Reset link prepared">
            <div class="form-group" style="margin-bottom: 18px">
              <label>Email address</label
              ><input type="email" required placeholder="you@company.com" />
            </div>
            <button class="btn primary" style="width: 100%">
              Send reset link
            </button>
          </form>
          <p style="margin-top: 18px">
            <a class="auth-link" href="login.html">← Back to sign in</a>
          </p>
        </div>
      </section>
    </div>
    <div class="toast-wrap"></div>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
